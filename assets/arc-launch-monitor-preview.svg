<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Arc Launch Monitor preview</title>
  <desc id="desc">Neon green terminal-style preview of Arc Launch Monitor showing token propagation and onchain pool diagnostics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020503"/>
      <stop offset="1" stop-color="#07130a"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="22%" r="70%">
      <stop offset="0" stop-color="#00ff47" stop-opacity=".14"/>
      <stop offset="1" stop-color="#00ff47" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#00ff47" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="44" y="38" width="1112" height="554" rx="18" fill="#050806" stroke="#00ff47" stroke-opacity=".28"/>

    <g transform="translate(72 68)">
      <rect x="0" y="0" width="14" height="14" rx="7" fill="#00ff47" filter="url(#softGlow)"/>
      <text x="28" y="13" fill="#00ff47" font-size="16" font-weight="700" letter-spacing="2">ARC // 5042</text>
      <text x="1055" y="13" text-anchor="end" fill="#728078" font-size="14">READ-ONLY MAINNET DIAGNOSTICS</text>
    </g>

    <g transform="translate(72 116)">
      <text x="0" y="0" fill="#f4f7f4" font-size="50" font-weight="800" letter-spacing="-2">ARC LAUNCH</text>
      <text x="0" y="50" fill="#00ff47" font-size="50" font-weight="800" letter-spacing="-2" filter="url(#softGlow)">MONITOR</text>
      <text x="0" y="91" fill="#9aa49c" font-size="17">Indexer data + direct Uniswap V3 pool state, side by side.</text>
    </g>

    <g transform="translate(72 252)">
      <rect x="0" y="0" width="505" height="286" rx="10" fill="#020503" stroke="#00ff47" stroke-opacity=".25"/>
      <rect x="0" y="0" width="505" height="42" rx="10" fill="#08110a"/>
      <circle cx="20" cy="21" r="4" fill="#00ff47" fill-opacity=".5"/>
      <circle cx="35" cy="21" r="4" fill="#00ff47" fill-opacity=".25"/>
      <circle cx="50" cy="21" r="4" fill="#00ff47" fill-opacity=".12"/>
      <text x="480" y="27" text-anchor="end" fill="#627168" font-size="12">monitor://arc/mainnet</text>

      <g font-size="15">
        <text x="24" y="78" fill="#00ff47">&gt;</text><text x="47" y="78" fill="#8f9992">token</text><text x="476" y="78" text-anchor="end" fill="#f4f7f4">0x...TOKEN</text>
        <line x1="24" x2="481" y1="92" y2="92" stroke="#ffffff" stroke-opacity=".06"/>
        <text x="24" y="121" fill="#00ff47">&gt;</text><text x="47" y="121" fill="#8f9992">arcpad</text><text x="476" y="121" text-anchor="end" fill="#00ff47">INDEXED</text>
        <line x1="24" x2="481" y1="135" y2="135" stroke="#ffffff" stroke-opacity=".06"/>
        <text x="24" y="164" fill="#00ff47">&gt;</text><text x="47" y="164" fill="#8f9992">uniswap_v3</text><text x="476" y="164" text-anchor="end" fill="#00ff47">POOL FOUND</text>
        <line x1="24" x2="481" y1="178" y2="178" stroke="#ffffff" stroke-opacity=".06"/>
        <text x="24" y="207" fill="#00ff47">&gt;</text><text x="47" y="207" fill="#8f9992">onchain_pool</text><text x="476" y="207" text-anchor="end" fill="#00ff47">LIVE</text>
        <line x1="24" x2="481" y1="221" y2="221" stroke="#ffffff" stroke-opacity=".06"/>
        <text x="24" y="250" fill="#00ff47">&gt;</text><text x="47" y="250" fill="#8f9992">status</text><text x="476" y="250" text-anchor="end" fill="#00ff47" font-weight="700">PROPAGATED_</text>
      </g>
    </g>

    <g transform="translate(604 252)">
      <rect x="0" y="0" width="524" height="286" rx="10" fill="#071009" stroke="#00ff47" stroke-opacity=".28"/>
      <text x="24" y="34" fill="#00ff47" font-size="13" font-weight="700" letter-spacing="2">ONCHAIN POOL COMPOSITION</text>
      <line x1="24" x2="500" y1="52" y2="52" stroke="#00ff47" stroke-opacity=".18"/>

      <g transform="translate(24 74)">
        <rect x="0" y="0" width="226" height="78" rx="7" fill="#020503" stroke="#ffffff" stroke-opacity=".07"/>
        <text x="16" y="26" fill="#6f7972" font-size="12">V3 FEE TIER</text>
        <text x="16" y="56" fill="#f4f7f4" font-size="22" font-weight="700">LIVE RPC</text>
      </g>
      <g transform="translate(274 74)">
        <rect x="0" y="0" width="226" height="78" rx="7" fill="#020503" stroke="#ffffff" stroke-opacity=".07"/>
        <text x="16" y="26" fill="#6f7972" font-size="12">CURRENT TICK</text>
        <text x="16" y="56" fill="#f4f7f4" font-size="22" font-weight="700">DIRECT READ</text>
      </g>

      <g transform="translate(24 166)">
        <rect x="0" y="0" width="476" height="88" rx="7" fill="#061309" stroke="#00ff47" stroke-opacity=".28"/>
        <text x="16" y="27" fill="#6f7972" font-size="12">LIQUIDITY REALITY CHECK</text>
        <text x="16" y="57" fill="#f4f7f4" font-size="17" font-weight="700">REPORTED LIQUIDITY</text>
        <text x="460" y="57" text-anchor="end" fill="#00ff47" font-size="17" font-weight="700">≠ QUOTE-ASSET RESERVE</text>
        <text x="16" y="77" fill="#91a098" font-size="11">Compare indexer headlines with tokens physically held by the pool.</text>
      </g>
    </g>

    <g transform="translate(72 563)">
      <text x="0" y="0" fill="#68746d" font-size="12">NO WALLET • NO SIGNING • NO BACKEND • PUBLIC READ-ONLY DATA</text>
      <text x="1055" y="0" text-anchor="end" fill="#00ff47" font-size="13" font-weight="700">exitonarc.xyz/monitor/</text>
    </g>
  </g>
</svg>
