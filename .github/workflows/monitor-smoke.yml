name: Arc Launch Monitor smoke test

on:
  push:
    branches: [main]
    paths:
      - 'monitor/**'
      - 'scripts/smoke-monitor.mjs'
      - '.github/workflows/monitor-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check monitor JavaScript syntax
        run: |
          node --check monitor/monitor.js
          node --check monitor/onchain.js
          node --check monitor/depth.js
          node --check monitor/range.js
          node --check monitor/diagnostics.js
      - name: Test three live Arc markets
        run: node scripts/smoke-monitor.mjs
